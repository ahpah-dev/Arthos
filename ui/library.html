<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — Arthos</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    body {
      background: var(--bg-app);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 24px 64px;
    }
    .wrap {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 4px;
      border-radius: 12px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--text-primary);
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #filter-input {
      width: 240px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    #filter-input:focus {
      border-color: var(--accent-border);
    }
    .btn {
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { color: var(--text-primary); border-color: var(--border-strong); }

    .list {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--bg-surface-hover); }
    .row-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .row-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-url {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .del-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 6px;
    }
    .del-btn:hover { background: var(--bg-pill-hover); color: var(--text-primary); }
    .empty {
      padding: 42px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="tabs">
        <button class="tab-btn active" data-tab="bookmarks">Bookmarks</button>
        <button class="tab-btn" data-tab="history">History</button>
        <button class="tab-btn" data-tab="downloads">Downloads</button>
        <button class="tab-btn" data-tab="vault">Passwords</button>
      </div>
      <div class="controls">
        <input id="filter-input" type="text" placeholder="Filter..." />
        <button id="btn-sync-chrome" class="btn hidden" type="button">Sync Chrome</button>
        <label id="lbl-import-csv" class="btn hidden" style="display:inline-flex;align-items:center;">Import CSV<input id="csv-file-input" type="file" accept=".csv" style="display:none;" /></label>
        <button id="btn-clear" class="btn" type="button">Clear</button>
      </div>
    </div>
    <div id="sync-banner" class="hidden" style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--text-secondary);"></div>
    <div id="list" class="list"></div>
  </div>

  <script>
    const post = (obj) => window.ipc.postMessage(JSON.stringify(obj));
    const listEl = document.getElementById("list");
    const filterInput = document.getElementById("filter-input");
    const btnSyncChrome = document.getElementById("btn-sync-chrome");
    const lblImportCsv = document.getElementById("lbl-import-csv");
    const csvFileInput = document.getElementById("csv-file-input");
    const syncBanner = document.getElementById("sync-banner");
    let state = { bookmarks: [], history: [], downloads: [], vault: [], chrome_sync_report: {} };
    const revealedIds = new Set();

    let activeTab = "bookmarks";
    const path = location.pathname.replace(/^\//, "").toLowerCase();
    if (path === "history") activeTab = "history";
    else if (path === "downloads") activeTab = "downloads";
    else if (path === "passwords" || path === "vault") activeTab = "vault";

    function updateTabButtons() {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === activeTab);
      });
      const isVault = activeTab === "vault";
      btnSyncChrome.classList.toggle("hidden", !isVault);
      lblImportCsv.classList.toggle("hidden", !isVault);
      syncBanner.classList.toggle("hidden", !isVault);
    }
    updateTabButtons();

    function render() {
      const q = filterInput.value.trim().toLowerCase();
      listEl.innerHTML = "";

      if (activeTab === "vault") {
        const rep = state.chrome_sync_report || {};
        const v20Note = rep.logins_skipped_v20 > 0
          ? ` · ${rep.logins_skipped_v20} Chrome v20 ABE entries require Import CSV (from chrome://password-manager/settings)`
          : "";
        syncBanner.textContent = rep.chrome_found
          ? `DPAPI Encrypted Vault · ${state.vault?.length || 0} saved logins · Chrome profiles scanned: ${rep.profiles_scanned || 0}${v20Note}`
          : `DPAPI Encrypted Vault · ${state.vault?.length || 0} saved logins · Click "Sync Chrome" or "Import CSV" to load passwords.`;
      }

      const items = state[activeTab] || [];
      const filtered = items.filter((item) => {
        const t = (item.title || item.filename || item.origin || item.username || "").toLowerCase();
        const u = (item.url || item.path || item.username || "").toLowerCase();
        return !q || t.includes(q) || u.includes(q);
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = activeTab === "vault"
          ? "No saved logins yet. Click Sync Chrome or Import CSV above."
          : `No ${activeTab} found.`;
        listEl.appendChild(empty);
        return;
      }

      for (const item of filtered) {
        const row = document.createElement("div");
        row.className = "row";

        const main = document.createElement("div");
        main.className = "row-main";
        const title = document.createElement("div");
        title.className = "row-title";
        const url = document.createElement("div");
        url.className = "row-url";

        if (activeTab === "vault") {
          title.textContent = `${item.origin || item.url} · ${item.username || "(no username)"}`;
          const shown = revealedIds.has(item.id);
          url.textContent = shown ? item.password : "•".repeat(Math.min(16, Math.max(8, (item.password || "").length)));
        } else {
          title.textContent = item.title || item.filename || item.url;
          url.textContent = activeTab === "downloads" ? `${item.status} · ${item.path || item.url}` : item.url;
        }
        main.appendChild(title);
        main.appendChild(url);

        const right = document.createElement("div");
        right.className = "row-right";

        if (activeTab === "vault") {
          const revBtn = document.createElement("button");
          revBtn.className = "del-btn";
          revBtn.textContent = revealedIds.has(item.id) ? "Hide" : "Reveal";
          revBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (revealedIds.has(item.id)) revealedIds.delete(item.id);
            else revealedIds.add(item.id);
            render();
          });
          const copyBtn = document.createElement("button");
          copyBtn.className = "del-btn";
          copyBtn.textContent = "Copy";
          copyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            navigator.clipboard?.writeText(item.password || "");
            post({ cmd: "show_toast", message: "Password copied to clipboard" });
          });
          const del = document.createElement("button");
          del.className = "del-btn";
          del.textContent = "✕";
          del.title = "Delete login";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            post({ cmd: "delete_vault_entry", id: item.id });
          });
          right.appendChild(revBtn);
          right.appendChild(copyBtn);
          right.appendChild(del);
        } else {
          const ts = item.created_at || item.visited_at || item.started_at;
          if (ts) {
            const d = new Date(ts);
            const span = document.createElement("span");
            span.textContent = d.toLocaleDateString([], { month: "short", day: "numeric" });
            right.appendChild(span);
          }
          if (activeTab === "bookmarks") {
            const del = document.createElement("button");
            del.className = "del-btn";
            del.textContent = "✕";
            del.title = "Delete bookmark";
            del.addEventListener("click", (e) => {
              e.stopPropagation();
              post({ cmd: "delete_bookmark", id: item.id });
            });
            right.appendChild(del);
          }
        }

        row.appendChild(main);
        row.appendChild(right);
        if (activeTab !== "downloads" && item.url) {
          row.addEventListener("click", () => post({ cmd: "navigate", input: item.url }));
        }
        listEl.appendChild(row);
      }
    }

    document.querySelectorAll(".tab-btn").forEach((b) => {
      b.addEventListener("click", () => {
        activeTab = b.dataset.tab;
        updateTabButtons();
        render();
      });
    });

    filterInput.addEventListener("input", render);
    btnSyncChrome.addEventListener("click", () => post({ cmd: "sync_chrome_now" }));
    csvFileInput.addEventListener("change", () => {
      const f = csvFileInput.files?.[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (typeof reader.result === "string") {
          post({ cmd: "import_chrome_csv", csv: reader.result });
        }
      };
      reader.readAsText(f);
      csvFileInput.value = "";
    });
    document.getElementById("btn-clear").addEventListener("click", () => {
      if (activeTab === "history") post({ cmd: "clear_history" });
      else if (activeTab === "bookmarks") post({ cmd: "clear_bookmarks" });
      else if (activeTab === "vault") post({ cmd: "clear_vault" });
      else post({ cmd: "clear_downloads" });
    });

    window.__arthosPageData = (data) => {
      const s = data.settings || {};
      document.documentElement.setAttribute("data-theme", s.theme || "dark");
      document.documentElement.setAttribute("data-accent", s.accent || "indigo");
      state = data;
      render();
    };

    post({ cmd: "get_state" });
  </script>
</body>
</html>
