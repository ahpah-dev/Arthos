<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Arthos</title>
  <link rel="stylesheet" href="arthos://localhost/theme.css" />
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(800px 420px at 50% 12%, var(--accent-soft), transparent 70%),
        var(--bg-app);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 28px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .logo-ring {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #clock {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    #greeting {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .search-shell {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .search-shell:focus-within {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-sm);
    }

    .mode-switch {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 2px;
      flex-shrink: 0;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.14s;
    }
    .mode-btn.active {
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    #hero-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
    }
    #hero-input::placeholder {
      color: var(--text-muted);
    }
    #hero-go {
      height: 36px;
      padding: 0 16px;
      border-radius: 11px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #hero-go:hover {
      filter: brightness(1.08);
    }

    .section {
      width: 100%;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .add-tile-btn {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }
    .add-tile-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    #dial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 12px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 16px 10px 14px;
      border-radius: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
    }
    .tile:hover {
      transform: translateY(-2px);
      background: var(--bg-surface-hover);
      border-color: var(--accent-border);
    }
    .tile-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-title {
      font-size: 12.5px;
      font-weight: 500;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile-del {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: none;
      background: var(--bg-pill);
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .tile:hover .tile-del {
      opacity: 1;
    }
    .tile-del:hover {
      color: var(--text-primary);
      background: var(--bg-pill-hover);
    }

    #add-form {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      gap: 8px;
      flex-wrap: wrap;
    }
    #add-form.open {
      display: flex;
    }
    #add-form input {
      flex: 1;
      min-width: 160px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    #add-form button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer-hints {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    kbd {
      font-family: inherit;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="logo-ring">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5L20.5 19.5H15.8L12 11.4L8.2 19.5H3.5L12 2.5Z" fill="url(#ntGrad)" />
          <circle cx="12" cy="17.5" r="2" fill="url(#ntGrad)" />
          <defs>
            <linearGradient id="ntGrad" x1="3.5" y1="2.5" x2="20.5" y2="19.5" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--accent)" />
              <stop offset="1" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div id="clock">12:00</div>
      <div id="greeting">Welcome to Arthos — lightweight, AI-native browsing</div>
    </div>

    <div class="search-shell">
      <div class="mode-switch">
        <button id="mode-web" class="mode-btn active" type="button">Web</button>
        <button id="mode-ai" class="mode-btn" type="button">✦ AI</button>
      </div>
      <input id="hero-input" type="text" placeholder="Search the web or enter a URL..." autofocus />
      <button id="hero-go" type="button">Go</button>
    </div>

    <div class="section">
      <div class="section-head">
        <span>Quick Access</span>
        <button id="toggle-add-btn" class="add-tile-btn" type="button">+ Add Shortcut</button>
      </div>
      <div id="dial-grid"></div>
      <div id="add-form">
        <input id="new-title" type="text" placeholder="Title (e.g. OpenAI)" />
        <input id="new-url" type="text" placeholder="URL (e.g. openai.com)" />
        <button id="save-tile-btn" type="button">Add</button>
      </div>
    </div>

    <div class="footer-hints">
      <span><kbd>Ctrl+K</kbd> Command Palette</span>
      <span><kbd>Ctrl+I</kbd> Arthos AI</span>
      <span><kbd>Ctrl+L</kbd> Omnibox</span>
      <span><kbd>Alt+R</kbd> Reader Mode</span>
      <span><kbd>Ctrl+Shift+N</kbd> Private Tab</span>
    </div>
  </div>

  <script>
    const post = (obj) => window.ipc.postMessage(JSON.stringify(obj));
    const clockEl = document.getElementById("clock");
    const greetingEl = document.getElementById("greeting");
    const heroInput = document.getElementById("hero-input");
    const heroGo = document.getElementById("hero-go");
    const modeWeb = document.getElementById("mode-web");
    const modeAi = document.getElementById("mode-ai");
    const dialGrid = document.getElementById("dial-grid");
    const addForm = document.getElementById("add-form");

    let aiMode = false;

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const h = now.getHours();
      const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      greetingEl.textContent = `${greet} · Arthos AI-native lightweight browser`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    function setMode(isAi) {
      aiMode = isAi;
      modeWeb.classList.toggle("active", !isAi);
      modeAi.classList.toggle("active", isAi);
      heroInput.placeholder = isAi ? "Ask Arthos AI anything..." : "Search the web or enter a URL...";
      heroGo.textContent = isAi ? "Ask ✦" : "Go";
      heroInput.focus();
    }
    modeWeb.addEventListener("click", () => setMode(false));
    modeAi.addEventListener("click", () => setMode(true));

    function submitHero() {
      const val = heroInput.value.trim();
      if (!val) return;
      if (aiMode && !val.startsWith("? ")) {
        post({ cmd: "navigate", input: `? ${val}` });
      } else {
        post({ cmd: "navigate", input: val });
      }
    }
    heroGo.addEventListener("click", submitHero);
    heroInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitHero();
    });

    document.getElementById("toggle-add-btn").addEventListener("click", () => {
      addForm.classList.toggle("open");
    });
    document.getElementById("save-tile-btn").addEventListener("click", () => {
      const title = document.getElementById("new-title").value.trim();
      const url = document.getElementById("new-url").value.trim();
      if (!title || !url) return;
      post({ cmd: "add_speed_dial", title, url });
      document.getElementById("new-title").value = "";
      document.getElementById("new-url").value = "";
      addForm.classList.remove("open");
    });

    window.__arthosPageData = (data) => {
      const s = data.settings || {};
      document.documentElement.setAttribute("data-theme", s.theme || "dark");
      document.documentElement.setAttribute("data-accent", s.accent || "indigo");

      dialGrid.innerHTML = "";
      for (const item of data.speed_dial || []) {
        const card = document.createElement("div");
        card.className = "tile";
        card.innerHTML = `
          <button class="tile-del" title="Remove">×</button>
          <div class="tile-badge"></div>
          <div class="tile-title"></div>
        `;
        card.querySelector(".tile-badge").textContent = item.icon || "★";
        card.querySelector(".tile-title").textContent = item.title;
        card.addEventListener("click", (e) => {
          if (e.target.closest(".tile-del")) {
            e.stopPropagation();
            post({ cmd: "remove_speed_dial", url: item.url });
            return;
          }
          post({ cmd: "navigate", input: item.url });
        });
        dialGrid.appendChild(card);
      }
    };

    post({ cmd: "get_state" });
  </script>
</body>
</html>
