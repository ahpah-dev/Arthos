<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arthos Chrome</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/chrome.css" />
</head>
<body>
  <div id="chrome-root">
    <!-- Row 1: Tab Strip & Window Controls -->
    <div id="titlebar">
      <button id="brand-btn" title="Arthos Home" aria-label="Arthos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5L20.5 19.5H15.8L12 11.4L8.2 19.5H3.5L12 2.5Z" fill="url(#arthosGrad)" />
          <circle cx="12" cy="17.5" r="2" fill="url(#arthosGrad)" />
          <defs>
            <linearGradient id="arthosGrad" x1="3.5" y1="2.5" x2="20.5" y2="19.5" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--accent)" />
              <stop offset="1" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
        </svg>
      </button>

      <div id="tab-strip"></div>

      <div id="tab-actions">
        <button id="new-tab-btn" class="icon-btn" title="New Tab (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="incognito-tab-btn" class="icon-btn" title="New Private Tab (Ctrl+Shift+N)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11h18M6 11l1.5-5.5A2 2 0 0 1 9.4 4h5.2a2 2 0 0 1 1.9 1.5L18 11"/>
            <circle cx="8" cy="16" r="2.5"/>
            <circle cx="16" cy="16" r="2.5"/>
            <path d="M10.5 16h3"/>
          </svg>
        </button>
      </div>

      <div id="drag-spacer" title="Drag window"></div>

      <div id="window-controls">
        <button id="win-min" class="win-btn" title="Minimize">
          <svg width="11" height="11" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button id="win-max" class="win-btn" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="win-close" class="win-btn win-close" title="Close">
          <svg width="11" height="11" viewBox="0 0 12 12"><path d="M2.5 2.5L9.5 9.5M9.5 2.5L2.5 9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Row 2: Navigation Bar & AI Omnibox -->
    <div id="navbar">
      <div class="nav-group">
        <button id="btn-back" class="nav-btn" title="Back (Alt+Left)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward (Alt+Right)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Reload (Ctrl+R)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </button>
      </div>

      <div id="omnibox-wrap">
        <div id="omnibox">
          <span id="omni-badge" class="badge-secure" title="Connection">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <input
            id="omnibox-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search, enter URL, or type '? question' to ask Arthos AI..."
          />
          <div class="omni-actions">
            <button id="btn-reader" class="omni-btn" title="Reader Mode (Alt+R)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H10a2 2 0 0 1 2 2v15a1.5 1.5 0 0 0-1.5-1.5H4.5A2.5 2.5 0 0 1 2 16V5.5Z"/><path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H14a2 2 0 0 0-2 2v15a1.5 1.5 0 0 1 1.5-1.5h6A2.5 2.5 0 0 0 22 16V5.5Z"/></svg>
            </button>
            <button id="btn-bookmark" class="omni-btn" title="Bookmark this page">
              <svg id="star-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="tool-group">
        <button id="btn-command" class="nav-btn" title="Command Palette (Ctrl+K)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button id="btn-library" class="nav-btn" title="Bookmarks, History & Downloads">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <button id="btn-downloads" class="nav-btn hidden" title="Downloads">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="btn-settings" class="nav-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="btn-ai" title="Toggle Arthos AI Copilot (Ctrl+I)">
          <span class="ai-spark">✦</span>
          <span>Arthos AI</span>
        </button>
      </div>
    </div>

    <!-- Row 3: Find in Page Bar (42px when open) -->
    <div id="find-bar" class="hidden">
      <div class="find-inner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="find-input" type="text" placeholder="Find in page..." />
        <button id="find-prev" class="find-btn" title="Previous match (Shift+Enter)">↑</button>
        <button id="find-next" class="find-btn" title="Next match (Enter)">↓</button>
        <button id="find-close" class="find-btn" title="Close (Esc)">✕</button>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>
  <script src="/chrome.js"></script>
</body>
</html>
