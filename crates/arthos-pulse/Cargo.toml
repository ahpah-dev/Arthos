[package]
name = "arthos-pulse"
version = "0.1.0"
edition = "2024"
description = "Arthos Pulse — lightweight SIMD quantized inference kernels, GGUF reader, and low-latency AI execution framework"
license = "Unlicense"

[dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
