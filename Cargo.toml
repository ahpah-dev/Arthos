[package]
name = "arthos"
version = "0.1.0"
edition = "2024"
description = "Arthos — an AI-native, super lightweight open-source web browser"
license = "Unlicense"
repository = "https://github.com/ahpah-dev/Arthos"

[dependencies]
tao = "0.37.2"
wry = { version = "0.57.2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream"] }
futures-util = "0.3"
url = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
